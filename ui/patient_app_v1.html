        // ═══════════════════════════════════════════════════════════
        // BACKEND SUBMISSION — shared for all levels (v13)
        // ═══════════════════════════════════════════════════════════
        /** Sends just the ambulance request to the server without a full re-submit.
         *  Used when submitToBackend() was already called (S._submitted=true) but the
         *  patient chose ambulance afterwards (EMERGENCY transport question path).
         */
        async function _sendAmbulanceRequestToServer() {
            if (!S.regNumber || !S._ambulanceNote) return;
            // Retry up to 6× in case submit is still in-flight
            for (let i = 0; i < 6; i++) {
                if (S.regNumber) break;
                await new Promise(r => setTimeout(r, 1500));
            }
            if (!S.regNumber) return;
            try {
                await fetch(`${API}/api/patient/${encodeURIComponent(S.regNumber)}/ambulance/request`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ambulance_note: S._ambulanceNote,
                        ambulance_to_patient_eta: S.ambEtaMinutes || 10
                    })
                });
            } catch (e) { console.warn('Ambulance request PATCH failed:', e); }
        }

        async function submitToBackend() {
            if (S._submitted) return;
            S._submitted = true;
            if (!S.regNumber) S.regNumber = genRegNumber();
            try {
                const qaList = (S.answersEN || S.answers || []).map(a => ({
                    question: a.question || '', question_en: a.question_en || a.question || '',
                    answer: a.answer || '', original_answer: a.original_answer || a.originalAnswer || a.answer || ''
                })).filter(a => a.question && a.answer);
                const mediaArr = (S.photos || []).length > 0
                    ? S.photos.map(p => ({ dataUrl: p.dataUrl, mime: p.mime || 'image/jpeg', type: p.type || 'photo' })) : null;
                // STANDARD/NON_URGENT patients navigate themselves — omit GPS so the
                // background simulation thread doesn't auto-move them to 'in_treatment'.
                const lvl = normalizeTriage((S.assessment || {}).triage_level);
                const selfNavigating = (lvl === 'STANDARD' || lvl === 'NON_URGENT');
                await fetch(API + '/api/patient/submit', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        complaint: S.complaint, complaint_en: S.complaintEN || S.complaint,
                        detected_language: S.selectedLang || S.detectedLang,
                        assessment: S.assessment,
                        hospital: S.selectedHospital || (S.hospitals && S.hospitals[0]) || null,
                        lat: selfNavigating ? null : S.lat, lon: selfNavigating ? null : S.lon, answers: qaList,
                        has_photo: (S.photos || []).length > 0, photo_count: (S.photos || []).length,
                        media: mediaArr, reg_number: S.regNumber,
                        health_number: S.healthNumber || null, data_consent: S.dataConsent !== false,
                        ambulance_note: S._ambulanceNote || null,
                        ambulance_total_eta: S.ambTotalEta || null,
                        ambulance_to_patient_eta: S.ambEtaMinutes || null
                    })
                });
            } catch (e) { console.warn('Backend submit failed (non-critical):', e); S._submitted = false; }
        }

        // ═══════════════════════════════════════════════════════════
        // PART 4: PHYSICIAN OVERRIDE POLLING (v13)
        // ═══════════════════════════════════════════════════════════
        let _physicianPollInterval = null;
        // Session token: prevents a decision from a previous session being shown
        // to a new patient. Set fresh each time polling starts.
        let _pollSessionRegNumber = null;

        function startPhysicianPolling(intervalSec, containerId) {
            if (_physicianPollInterval) clearInterval(_physicianPollInterval);
            _physicianPollInterval = null;
            _pollSessionRegNumber = null;

            const container = document.getElementById(containerId);
            if (!container) return;

            // Initial Timeline State
            if (!S._timelineEvents || S._timelineEvents.length === 0) {
                S._timelineEvents = [{
                    type: 'sent',
                    title: t('rs_timeline_sent'),
                    time: new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit' }),
                    status: 'completed'
                }];
            }

            _renderAssTimeline(containerId);

            let polls = 0;
            let _lastShownTs = null;
            let _lastDoctorAssigned = null;

            function _doPoll() {
                polls++;
                if (polls > 720) { clearInterval(_physicianPollInterval); return; }
                if (!S.regNumber) return;
                if (!_pollSessionRegNumber) _pollSessionRegNumber = S.regNumber;
                if (_pollSessionRegNumber !== S.regNumber) {
                    clearInterval(_physicianPollInterval); return;
                }
                fetch(`${API}/api/patient/${encodeURIComponent(S.regNumber)}/status`)
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (!data) return;
                        if (_pollSessionRegNumber !== S.regNumber) return;

                        // ── Doctor assignment ───────────────────
                        const docName = (data.assigned_doctor || '').split('||')[0].trim();
                        if (docName && docName !== _lastDoctorAssigned) {
                            _lastDoctorAssigned = docName;
                            const assignedAt = data.doctor_assigned_at || new Date().toISOString();
                            const timeStr = (() => { try { let s = String(assignedAt).replace(' ', 'T'); if (!/Z$/.test(s)) s += 'Z'; return new Date(s).toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit' }); } catch { return ''; } })();

                            const safeName = docName.startsWith('Dr.') ? docName : 'Dr. ' + docName;
                            const photoFilename = safeName.replace(/Dr\.\s*/i, 'Dr.').replace(/\s+/g, '_') + '.png';
                            const photoUrl = `/doctor_photos/${photoFilename}`;

                            // Add to timeline
                            S._timelineEvents.push({
                                type: 'assigned',
                                title: t('rs_timeline_assigned'),
                                sub: safeName,
                                time: timeStr,
                                status: 'completed',
                                photo: data.doctor_photo || photoUrl
                            });
                            _renderAssTimeline(containerId);
                            _ensureDocChatPanel();
                            const nameEl = document.getElementById('docChatDocName');
                            if (nameEl) nameEl.textContent = safeName;
                            const photoEl = document.getElementById('docChatDocPhoto');
                            if (photoEl) {
                                photoEl.innerHTML = `<img src="${data.doctor_photo || photoUrl}" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/notionists/svg?seed=${encodeURIComponent(docName)}&backgroundColor=b6e3f4';" style="width:100%; height:100%; object-fit:cover;">`;
                            }
                        }

                        const action = (data.physician_decision || '').toUpperCase();
                        const ambStatus = data.ambulance_status || null;

                        if ((ambStatus === 'AMBULANCE' || action === 'AMBULANCE') && !S._ambTimelineTriggered) {
                            S._ambTimelineTriggered = true;
                            _pushTimelineEvent('ambulance_dispatched', t('rs_timeline_amb_disp'));
                            // Start countdown even when user is on assessment page (not ambulance page)
                            if (!_ambRemainingMinutes && S.ambEtaMinutes) {
                                startAmbulanceCountdown(S.ambEtaMinutes, '#30D158', '#22c55e');
                            }
                        }

                        if (!action || action === 'AMBULANCE' || action === 'AMBULANCE_REQUEST') return;

                        if (action === 'MESSAGE') {
                            const msgNote = data.physician_note_translated || data.physician_note || '';
                            const noteKey = msgNote + (data.override_timestamp || '');
                            if (noteKey === _lastShownTs) return;
                            _lastShownTs = noteKey;
                            _injectDoctorMsgInChat(containerId, msgNote, data.override_timestamp || data.updated_at);
                            return;
                        }

                        // Only process a physician decision if a doctor has actually been assigned first
                        if (!_lastDoctorAssigned) return;

                        const latestEntry = (data.physician_note || '').split('\n---\n')[0].trim();
                        const noteKey = latestEntry || action;
                        if (noteKey === _lastShownTs) return;
                        _lastShownTs = noteKey;

                        clearInterval(_physicianPollInterval);
                        _physicianPollInterval = setInterval(_doPoll, 15000);
                        polls = 0;

                        handlePhysicianDecision(data, containerId);
                    })
                    .catch(() => { });
            }
            _physicianPollInterval = setInterval(_doPoll, intervalSec * 1000);
        }

        function handlePhysicianDecision(data, containerId) {
            showPhysicianDecisionCard(data, containerId);
        }

        function showPhysicianDecisionCard(data, containerId) {
            const decision = (data.physician_decision || '').toUpperCase();
            const newLvl = data.new_triage_level ? normalizeTriage(data.new_triage_level) : normalizeTriage(data.ai_triage_level);
            let note = data.physician_note_translated || null;
            if (!note) {
                const _rawNote = data.physician_note || '';
                const _latestEntry = _rawNote.split('\n---\n')[0].trim();
                const _noteMatch = _latestEntry.match(/^\\[.*?\\]\s*\\[.*?\\]\s*([\s\S]+)$/);
                note = (_noteMatch ? _noteMatch[1].trim() : _latestEntry) || null;
            }
            const meta = MTS_META[newLvl] || MTS_META.URGENT;
            const timeStr = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit' });

            if (newLvl) {
                S.assessment = S.assessment || {};
                S.assessment.triage_level = newLvl;
            }

            // Push to Timeline
            const iconText = t('physician_decision_title');
            let subText = t('physician_decision_confirmed');
            if (decision === 'UPGRADE') subText = t('physician_decision_upgraded');
            if (decision === 'DOWNGRADE') subText = t('physician_decision_downgraded');
            if (decision === 'ADJUST') subText = t('physician_decision_adjusted');
            const dupe = (S._timelineEvents || []).find(e => e.type === 'decision' && e.sub === subText);
            if (!dupe) {
                S._timelineEvents.push({
                    type: 'decision', title: iconText, sub: subText, time: timeStr, status: 'completed', meta: meta, isUpgrade: decision === 'UPGRADE'
                });
            }
            _renderAssTimeline(containerId);

            _syncDashboardWithDecision(data, newLvl);
        }

        function _renderAssTimeline(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            let html = `
            <div style="background:var(--card); border:1.5px solid var(--border); border-radius:var(--r-lg); padding:20px; margin-bottom:16px;">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
                    <div style="width:10px; height:10px; border-radius:50%; background:#30D158; box-shadow:0 0 8px #30D158; animation:elegant-pulse 2s infinite ease-in-out;"></div>
                    <div style="font-size:1.05rem; font-weight:800; color:var(--text);">${t('rs_timeline_title')}</div>
                </div>
                <div class="stepper-wrap" style="position:relative; padding-left:26px;">
                    <div style="position:absolute; left:5px; top:5px; bottom:5px; width:2px; background:var(--border);"></div>
                    ${(S._timelineEvents || []).map((ev, idx) => {
                const isLast = idx === S._timelineEvents.length - 1;
                let dotColor = 'var(--primary)';
                let bg = 'var(--card-alt)';
                if (ev.type === 'decision') {

        // ── Chat voice-to-text implementation ───────────────────────────────
        async function _toggleChatMic() {
            const btn = document.getElementById('docChatMicBtn');
            const input = document.getElementById('docChatInput');
            if (!btn || !input) return;

            if (_chatIsRecording) {
                if (_chatMediaRec && _chatMediaRec.state !== 'inactive') _chatMediaRec.stop();
                if (_chatWebSpeech) { try { _chatWebSpeech.stop(); } catch(_) {} _chatWebSpeech = null; }
                _chatIsRecording = false;
                btn.textContent = '🎤';
                btn.style.background = 'rgba(148,163,184,0.15)';
                btn.style.color = '#22d3ee';
                btn.style.animation = '';
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/mp4']
                    .find(t => MediaRecorder.isTypeSupported(t)) || '';
                _chatMediaRec = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
                _chatAudioChunks = [];
                _chatWebSpeechResult = '';
                _chatIsRecording = true;

                _chatMediaRec.ondataavailable = e => { if (e.data.size > 0) _chatAudioChunks.push(e.data); };
                _chatMediaRec.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    btn.textContent = '⌛';
                    // Wait briefly for Web Speech final result
                    await new Promise(r => setTimeout(r, 600));
                    const wsr = _chatWebSpeechResult.trim();
                    if (wsr) {
                        input.value = wsr;
                        input.focus();
                        btn.textContent = '🎤';
                        return;
                    }
                    // Fallback: Azure Speech via server
                    try {
                        const blob = new Blob(_chatAudioChunks, { type: mime || 'audio/webm' });
                        if (blob.size > 500) {
                            const form = new FormData();
                            form.append('audio', blob, 'chat_reply.webm');
                            if (S.selectedLang || S.detectedLang) form.append('lang', S.selectedLang || S.detectedLang);
                            const r = await fetch(API + '/api/patient/transcribe', { method: 'POST', body: form });
                            const d = await r.json();
                            if (d.text && d.text.trim()) {
                                input.value = d.text.trim();
                                input.focus();
                                btn.textContent = '🎤';
                                return;
                            }
                        }
                    } catch (_) {}
                    toast(t('chat_mic_not_understood') || 'Could not understand — type instead', 'warn');
                    btn.textContent = '🎤';
                };

                _chatMediaRec.start(100);
                btn.textContent = '🛑';
                btn.style.background = '#ef4444';
                btn.style.color = 'white';
                btn.style.animation = 'pulse 1.5s infinite';

                // Web Speech in parallel for instant results
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SR) {
                    _chatWebSpeech = new SR();
                    _chatWebSpeech.lang = S.selectedLang || navigator.language || 'de-DE';
                    _chatWebSpeech.continuous = true;
                    _chatWebSpeech.interimResults = true;
                    _chatWebSpeech.onresult = ev => {
                        let final = '', interim = '';
                        for (let i = 0; i < ev.results.length; i++) {
                            if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
                            else interim += ev.results[i][0].transcript;
                        }
                        const display = (final || interim).trim();
                        if (display) { _chatWebSpeechResult = display; input.value = display; }
                    };
                    _chatWebSpeech.onerror = () => {};
                    _chatWebSpeech.onend = () => { _chatWebSpeech = null; };
                    try { _chatWebSpeech.start(); } catch(_) { _chatWebSpeech = null; }
                }
            } catch (err) {
                console.error('Chat mic error:', err);
                toast('Microphone access denied', 'warn');
            }
        }

        async function sendDoctorChatMsg() {
            const input = document.getElementById('docChatInput');
            const text = (input ? input.value : '').trim();
            if (!text) return;
            if (input) { input.value = ''; input.disabled = true; }

            // Wait for regNumber if still in-flight
            if (!S.regNumber) {
                await new Promise(resolve => {
                    const iv = setInterval(() => { if (S.regNumber) { clearInterval(iv); resolve(); } }, 300);
                    setTimeout(() => { clearInterval(iv); resolve(); }, 8000);
                });
            }
            if (!S.regNumber) { if (input) input.disabled = false; return; }

            try {
                const r = await fetch(`${API}/api/patient/${encodeURIComponent(S.regNumber)}/reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (r.ok) {
                    _addDocChatMsg('patient', text, new Date().toISOString());
                }
            } catch (_) { }
            if (input) input.disabled = false;
        }

        /** Inject doctor's note into the unified chat panel */
        function _injectDoctorMsgInChat(containerId, noteText, noteTime) {
            _ensureDocChatPanel();
            const msgArea = document.getElementById('docChatMessages');
            if (!msgArea) return;
            // Avoid duplicates
            if ([...msgArea.querySelectorAll('[data-doc-note]')].some(n => n.dataset.docNote === noteText)) return;
            const timeStr = noteTime ? (() => {
                try {
                    let s = String(noteTime).trim().replace(' ', 'T');
                    if (!/Z$|[+-]\d{2}:?\d{2}$/.test(s)) s += 'Z';
                    return new Date(s).toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit' });
                } catch { return ''; }
            })() : '';
            const wrap = document.createElement('div');
            wrap.dataset.docNote = noteText;
            wrap.style.cssText = 'display:flex;justify-content:flex-start;';
            wrap.innerHTML = `
                <div style="max-width:82%;background:rgba(255,255,255,0.07);border:1px solid rgba(34,211,238,0.2);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:0.85rem;">
                    <div style="font-size:0.68rem;font-weight:700;color:#22d3ee;margin-bottom:4px;">👨‍⚕️ Doctor${timeStr ? ' · ' + timeStr : ''}</div>
                    <div style="color:var(--text,#e2e8f0);line-height:1.5;">${escHtml(noteText)}</div>
                </div>`;
            msgArea.appendChild(wrap);
            msgArea.scrollTop = msgArea.scrollHeight;

            if (!_docChatOpen) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } catch (e) { }

                const tile = document.querySelector('.ass-tile.report');
                if (tile) {
                    let badge = tile.querySelector('.chat-badge');
                    if (!badge) {
                        badge = document.createElement('div');
                        badge.className = 'chat-badge';
                        badge.style.cssText = 'position:absolute; top:-6px; right:-6px; background:#ef4444; color:white; font-size:12px; font-weight:900; width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:50%; box-shadow:0 0 10px rgba(239,68,68,0.5); z-index:10; animation:elegant-pulse 1s infinite;';
                        badge.textContent = '1';
                        if (getComputedStyle(tile).position === 'static') tile.style.position = 'relative';
                        tile.appendChild(badge);
                    } else {
                        badge.textContent = parseInt(badge.textContent || '1') + 1;
                    }
                }
            }
        }

        // ── Patient reply sender ────────────────────────────────────────────
        async function _sendPatientReply(containerId) {
            const textarea = document.getElementById(`patReplyText_${containerId}`);
            const sentEl = document.getElementById(`patReplySent_${containerId}`);
            if (!textarea) return;

            const text = (textarea.value || '').trim();
            if (!text) {
                textarea.placeholder = t('reply_placeholder') || 'Type your message first…';
                textarea.focus();
                return;
            }

            // If regNumber isn't ready yet wait up to 8 s for submitToBackend() to complete
            if (!S.regNumber) {
                let waited = 0;
                await new Promise(resolve => {
                    const iv = setInterval(() => {
                        waited += 200;
                        if (S.regNumber || waited >= 8000) { clearInterval(iv); resolve(); }
                    }, 200);
                });
            }
            if (!S.regNumber) {
                console.warn('_sendPatientReply: no regNumber after wait');
                if (sentEl) {
                    sentEl.textContent = '⚠️ Could not send — no session ID. Please try again.';
                    sentEl.style.color = '#f87171';
                    sentEl.style.display = 'block';
                    setTimeout(() => { sentEl.style.display = 'none'; sentEl.style.color = '#30D158'; }, 5000);
                }
                return;
            }

            textarea.disabled = true;
            const origBtn = textarea.nextElementSibling;
            if (origBtn) origBtn.disabled = true;
            try {
                const res = await fetch(`${API}/api/patient/${encodeURIComponent(S.regNumber)}/reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (res.ok) {
                    textarea.value = '';
                    if (sentEl) {
                        sentEl.textContent = t('reply_sent') || '✅ Message sent to doctor';
                        sentEl.style.color = '#30D158';
                        sentEl.style.display = 'block';
                        setTimeout(() => { sentEl.style.display = 'none'; }, 4000);
                    }
                } else {
                    const errBody = await res.text().catch(() => '');
                    console.error('Reply send HTTP error:', res.status, errBody);
                    if (sentEl) {
                        sentEl.textContent = `⚠️ Error ${res.status} — please try again`;
                        sentEl.style.color = '#f87171';
                        sentEl.style.display = 'block';
                        setTimeout(() => { sentEl.style.display = 'none'; sentEl.style.color = '#30D158'; }, 5000);
                    }
                }
            } catch (e) {
                console.error('Reply send failed:', e);
                if (sentEl) {
                    sentEl.textContent = '⚠️ Network error — please try again';
                    sentEl.style.color = '#f87171';
                    sentEl.style.display = 'block';
                    setTimeout(() => { sentEl.style.display = 'none'; sentEl.style.color = '#30D158'; }, 5000);
                }
            }
            textarea.disabled = false;
            if (origBtn) origBtn.disabled = false;
        }
    </script>
